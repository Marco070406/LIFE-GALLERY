<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Adulte — photo à venir">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <circle cx="860" cy="880" r="260" fill="#fff" fill-opacity="0.06"/>
  <circle cx="300" cy="820" r="140" fill="#fff" fill-opacity="0.05"/>
  <g fill="#fff" font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="580" font-size="96" font-weight="600" fill-opacity="0.9">Adulte</text>
    <text x="600" y="660" font-size="30" letter-spacing="8" fill-opacity="0.55">PHOTO À VENIR</text>
  </g>
</svg>
